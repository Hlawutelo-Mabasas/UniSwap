<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="login" class="register-card-padding">
        <div class="logo-wrapper">
            <img src="https://github.com" alt="UniSwap Logo" class="nav-logo main-form-logo">
        </div>
        <form id="reg-form">
            <h1>REGISTER</h1>
            
            <div class="input-container">
                <input type="text" id="firstname" placeholder=" ">
                <label for="firstname">First Name</label>
            </div>

            <div class="input-container">
                <input type="text" id="middlename" placeholder=" ">
                <label for="middlename">Middle Name</label>
            </div>

            <div class="input-container">
                <input type="text" id="lastname" placeholder=" ">
                <label for="lastname">Last Name</label>
            </div>

            <div class="input-container">
                <input type="text" id="email" placeholder=" ">
                <label for="email">Email Address</label>
            </div>

            <div class="input-container">
                <input type="password" id="password" placeholder=" ">
                <label for="password">Password</label>
                <span id="toggle-password" class="eye-icon">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </span>
            </div>

            <div class="input-container">
                <input type="password" id="confirm-password" placeholder=" ">
                <label for="confirm-password">Confirm Password</label>
                <span id="toggle-confirm" class="eye-icon">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </span>
            </div>

            <div class="input-container">
                <input type="date" id="dob" placeholder=" ">
                <label for="dob">Date of Birth</label>
            </div>

            <div class="input-container">
                <input type="text" id="address" placeholder=" ">
                <label for="address">Address</label>
            </div>
            
            <a href="login.html">Already have an account? Login</a>
            <button type="submit">REGISTER</button>
        </form>
    </div>
</body>
</html>
