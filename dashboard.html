<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniSwap - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="app-header">
        <div class="header-logo">
            <img src="https://github.com" alt="UniSwap Logo" class="nav-logo">
            <span>UniSwap</span>
        </div>
        <nav class="nav-links">
            <button id="nav-browse" class="nav-btn active">Browse Marketplace</button>
            <button id="nav-sell" class="nav-btn">Seller Dashboard</button>
            <a href="checkout.html" class="cart-link">Cart (<span id="cart-count">0</span>)</a>
            <a href="index.html" class="logout-link">Logout</a>
        </nav>
    </header>

    <main class="dashboard-wrapper">
        <section id="view-browse" class="dashboard-section active">
            <div class="search-bar-container">
                <input type="text" id="search-input" placeholder="Search products by name or product code...">
            </div>
            <div class="products-grid" id="marketplace-grid"></div>
        </section>

        <section id="view-sell" class="dashboard-section">
            <div class="seller-layout">
                <div class="seller-form-panel">
                    <h2>Upload New Product</h2>
                    <form id="upload-form">
                        <div class="input-container">
                            <input type="text" id="prod-name" placeholder=" " required>
                            <label for="prod-name">Product Name</label>
                        </div>
                        <div class="input-container">
                            <input type="text" id="prod-price" placeholder=" " required>
                            <label for="prod-price">Price (ZAR)</label>
                        </div>
                        <div class="input-container">
                            <input type="text" id="prod-code" placeholder=" " required>
                            <label for="prod-code">Product Code</label>
                        </div>
                        <div class="input-container file-container">
                            <input type="file" id="prod-image" accept="image/*" required>
                        </div>
                        <button type="submit" class="btn-submit">List Product</button>
                    </form>
                </div>

                <div class="seller-management-panel">
                    <div class="management-block">
                        <h2>Your Active Listings</h2>
                        <div class="listings-list" id="my-listings-container"></div>
                    </div>

                    <div class="management-block">
                        <h2>Incoming Delivery Requests</h2>
                        <div class="incoming-orders-list" id="incoming-orders-container"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
