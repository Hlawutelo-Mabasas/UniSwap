<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="login">
        <div class="logo-wrapper">
            <img src="https://github.com" alt="UniSwap Logo" class="nav-logo main-form-logo">
        </div>
        <form id="log-in">
            <h1>LOGIN</h1>
            
            <div class="input-container">
                <input type="text" id="firstnames" placeholder=" ">
                <label for="firstnames">First Names</label>
            </div>
            
            <div class="input-container">
                <input type="password" id="password" placeholder=" ">
                <label for="password">Password</label>
                <span id="toggle-password" class="eye-icon">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </span>
            </div>
            
            <input type="checkbox" id="check">
            <label for="check">Remember Me</label>
            
            <a href="register.html">Don't have an account? register</a>
            <button type="submit">LOGIN</button>
        </form>
    </div>
</body>
</html>
