<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniSwap - Checkout</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="app-header">
        <div class="header-logo">
            <img src="https://github.com" alt="UniSwap Logo" class="nav-logo">
            <span>UniSwap</span>
        </div>
        <nav class="nav-links">
            <a href="dashboard.html" class="cart-link">Back to Marketplace</a>
            <a href="index.html" class="logout-link">Logout</a>
        </nav>
    </header>

    <main class="dashboard-wrapper checkout-centered-main">
        <div class="checkout-wrapper">
            <h1>Book Campus Delivery</h1>
            <p class="delivery-notice-text">You will transfer the money to the seller in person upon physical delivery of the items.</p>
            
            <div class="checkout-grid">
                <div class="checkout-summary-box">
                    <h3>Order Summary</h3>
                    <div id="checkout-summary"></div>
                </div>

                <form id="checkout-form">
                    <div class="input-container">
                        <input type="text" id="buyer-name" placeholder=" " required>
                        <label for="buyer-name">Full Name</label>
                    </div>
                    
                    <div class="input-container">
                        <input type="text" id="buyer-phone" placeholder=" " required>
                        <label for="buyer-phone">Mobile Number</label>
                    </div>
                    
                    <div class="input-container">
                        <input type="text" id="buyer-address" placeholder=" " required>
                        <label for="buyer-address">Campus Delivery Address (Residence & Room)</label>
                    </div>

                    <button type="submit" class="btn-submit">Confirm Order & Notify Seller</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
